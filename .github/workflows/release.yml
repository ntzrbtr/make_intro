# Builds Make Intro as a universal app.
# - Pushing a tag like v1.2.0 publishes a GitHub release with the zipped app attached.
# - Running the workflow manually ("Run workflow") only builds the app and keeps it as an artifact.
name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the build number (commit count) and tags

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Determine version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=Make-Intro-$VERSION.zip" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          ./app/build.sh 2>&1 | tee build.log

      - name: Check localization
        run: |
          if ! git diff --quiet -- app/Localizable.xcstrings; then
            echo "::error::app/Localizable.xcstrings is out of sync with the code – build locally and commit the catalog."
            git diff -- app/Localizable.xcstrings
            exit 1
          fi
          if grep -q '^Warning:' build.log; then
            grep '^Warning:' build.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Verify app
        run: |
          APP="build/Make Intro.app"
          lipo -archs "$APP/Contents/MacOS/MakeIntro"
          codesign --verify --strict "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"

      - name: Package
        run: ditto -c -k --keepParent "build/Make Intro.app" "$ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Installation

          1. Download the ZIP below, unzip it and move **Make Intro.app** to your Applications folder.
          2. The app is not notarized by Apple, so macOS blocks the first launch. Open it once, then go to
             **System Settings → Privacy & Security** and click **Open Anyway**.
             Alternatively run: `xattr -dr com.apple.quarantine "/Applications/Make Intro.app"`

          Requires macOS 15 or later (Apple Silicon or Intel).
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --verify-tag \
            --title "Make Intro $VERSION" \
            --notes-file notes.md \
            --generate-notes
